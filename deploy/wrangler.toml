# Flight Journal web — installable PWA, separate from the
# beatrackfam-prod store Worker and the cockpit-companion Worker.
# Serves ../dist (Expo web export) with SPA fallback (see src/index.js).
name = "flight-journal"
main = "src/index.js"
compatibility_date = "2026-10-29"
workers_dev = true

[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true
