name: Build macOS (FlightJournal)

# MANUAL TRIGGER ONLY: this workflow never runs on its own — it only spends
# macOS minutes when someone clicks "Run workflow" in the Actions tab.
#
# macOS PILOT (phase 1, Nov 27, 2026): proves the native Mac pipeline
# end-to-end for ONE app before the other apps get Mac targets. The Mac
# app is a react-native-macos target (folder macos/, committed — Expo
# prebuild does NOT generate it) sharing the app's JS via platform
# variants (app/(tabs)/_layout.macos.tsx sidebar UI, lib/pro.macos.ts
# demo-mode Pro) and the metro.config.js macOS resolver shim.
#
# ⚠️ ASSUMED PROFILE NAME — VERIFY BEFORE THE FIRST RUN:
# The archive/export steps below expect a Mac App Store Connect
# distribution profile named exactly:
#
#     FlightJournal - Pilot Logbook
#
# Joey created the profile in the Developer portal on Nov 27, 2026
# (type "Mac", not Catalyst; App ID com.beatrackfaminc.flightjournal),
# but the exact name he saved was not visible from the repo. If the
# portal shows a different name (e.g. "FlightJournal App Mac"), update
# MAC_PROFILE_NAME below AND the ExportOptions.plist this workflow
# generates, or signing will fail.
#
# ⚠️ VERSION MISMATCH RISK (known, accepted for the pilot):
# The app runs react-native 0.86 (Expo SDK 57). react-native-macos —
# a community fork — currently tops out at 0.83.0 (peer react-native
# 0.83.10); there is NO react-native-macos release paired with RN
# 0.86. The macOS target therefore builds the app's JS against the
# react-native-macos 0.83 fork (metro maps 'react-native' →
# 'react-native-macos' for the macos platform only; ios/android/web
# keep using RN 0.86 untouched). JS bundling for macos is verified,
# but the 0.83↔0.86 gap can still bite at native-compile or runtime
# in ways only the first run of this workflow can reveal.
#
# ⚠️ NO AUTO-BUMP IN THIS WORKFLOW (deliberate divergence from the
# iOS/Android workflows): .github/scripts/bump-build-number.py bumps
# app.json's iOS buildNumber + Android versionCode in sync and is
# owned by those workflows (they commit the new number back). The Mac
# build instead READS the current version/build from app.json and
# stamps them into the Mac archive. Consequence: App Store Connect
# rejects a second Mac upload with the SAME build number — before
# re-running this workflow, advance the number (any iOS/Android
# workflow run does it, or edit app.json's ios.buildNumber by hand).
# There is intentionally no commit-back step here.
#
# HUMAN PREREQUISITES (Joey, done Nov 27, 2026):
#   1. macOS platform added to the existing App Store Connect record
#      for com.beatrackfaminc.flightjournal. ✔
#   2. Mac App Store Connect distribution profile created (see the
#      assumed-name warning above). ✔ (name to verify)
#   3. Repo secrets already exist from the iOS workflow:
#      ASC_API_KEY_ID, ASC_API_KEY_P8, ASC_API_ISSUER_ID,
#      APPLE_TEAM_ID, IOS_DISTRIBUTION_P12, IOS_DISTRIBUTION_PASSWORD
#      (the same Apple Distribution certificate signs Mac builds).
#   4. NO App Clip on macOS — App Clips are iOS-only, so there is no
#      Mac clip profile and nothing to embed.

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload the .pkg to App Store Connect (TestFlight / Mac App Store) after building'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # ⚠️ Must match the profile name in the Developer portal exactly.
  MAC_PROFILE_NAME: 'FlightJournal - Pilot Logbook'

jobs:
  build-macos:
    name: Archive FlightJournal macOS (Release)
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read app version and build number from app.json
        # Read-only (no bump — see the header comment). The Mac archive
        # is stamped with these via MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION overrides at archive time.
        run: |
          echo "APP_VERSION=$(jq -r '.expo.version' app.json)" >> "$GITHUB_ENV"
          echo "APP_BUILD=$(jq -r '.expo.ios.buildNumber' app.json)" >> "$GITHUB_ENV"
          echo "Mac build will be stamped version $APP_VERSION ($APP_BUILD from app.json)."

      - name: Select the newest Xcode on the runner
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XC" ]; then XC="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"; fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      # --legacy-peer-deps is required in ALL THREE build workflows:
      # react-native-macos@0.83.0 lives in the SHARED package.json (it
      # is a devDependency of the one project all platforms build
      # from) and declares a peer on react-native@0.83.10 while the
      # app runs react-native@0.86 (and reanimated 4.8 peers at
      # 0.87–0.89), so a strict npm ci dies with ERESOLVE before
      # anything installs — on iOS and Android too, not just here.
      # The flag only skips peer enforcement: the lockfile pins every
      # version, so the installed tree is identical with or without
      # it. Keep the flag in ios-build.yml / android-build.yml in
      # sync with this one for as long as react-native-macos is a
      # project dependency.
      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Install CocoaPods (macOS target)
        # The macos/ project is committed (generated by
        # react-native-macos-init, then adapted: bundle ID
        # com.beatrackfaminc.flightjournal, Expo entry file + "main"
        # module name). No expo prebuild step — prebuild has no macOS
        # target and must not touch this folder.
        working-directory: macos
        run: pod install

      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          KEY_FILE="$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          mkdir -p "$HOME/private_keys"
          raw="$ASC_API_KEY_P8"
          # Undo common paste accidents: surrounding quotes, CR characters,
          # and literal \n sequences instead of real line breaks.
          raw="${raw#\"}"; raw="${raw%\"}"
          raw="${raw#\'}"; raw="${raw%\'}"
          raw="$(printf '%s' "$raw" | tr -d '\r')"
          if [[ "$raw" != *$'\n'* ]]; then
            raw="$(printf '%s' "$raw" | sed 's/\\n/\n/g')"
          fi
          # If the BEGIN/END lines were lost, wrap the base64 body again.
          if [[ "$raw" != *"BEGIN PRIVATE KEY"* ]]; then
            body="$(printf '%s' "$raw" | tr -d '[:space:]')"
            raw="$(printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' "$(printf '%s' "$body" | fold -w 64)")"
          fi
          printf '%s\n' "$raw" > "$KEY_FILE"
          if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "::error::The ASC_API_KEY_P8 secret is not a valid .p8 key. Re-paste the full contents of the .p8 file from App Store Connect, including the BEGIN/END lines."
            exit 1
          fi

      - name: Import distribution certificate
        env:
          P12_B64: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          P12_PW: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
        run: |
          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          # Never auto-lock mid-build: a locked keychain makes codesign hang
          # silently (run #24 hung 1h53m in Embed Pods Frameworks).
          security set-keychain-settings -lut 7200 build.keychain
          # Search ONLY this keychain so a generic identity name can't resolve
          # ambiguously against stale certs in the login keychain.
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import "$RUNNER_TEMP/dist.p12" -k build.keychain -P "$P12_PW" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          # Pin the exact signing identity (SHA-1) instead of the generic
          # "iPhone Distribution" or "Apple Distribution" name.
          IDENT_SHA=$(security find-identity -v -p codesigning build.keychain | grep -m1 -E 'iPhone Distribution|Apple Distribution' | awk '{print $2}')
          if [ -z "$IDENT_SHA" ]; then
            echo "::error::No iPhone/Apple Distribution identity found in build.keychain after import."
            security find-identity -v -p codesigning build.keychain || true
            exit 1
          fi
          echo "Using signing identity $IDENT_SHA"
          echo "DIST_SIGN_IDENTITY=$IDENT_SHA" >> "$GITHUB_ENV"
          echo "Certificate imported."

      - name: Archive the Mac app (manual signing)
        # Step-level cap: a healthy archive finishes well under this.
        # Single target (no App Clip on macOS), so passing
        # PROVISIONING_PROFILE_SPECIFIER on the command line is safe
        # here — unlike the iOS archive, which must NOT (it would
        # override the clip's profile too).
        timeout-minutes: 50
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -workspace macos/flight-journal-app.xcworkspace \
            -scheme flight-journal-app-macOS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$GITHUB_WORKSPACE/build/FlightJournal-macOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$DIST_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$MAC_PROFILE_NAME" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD"

      - name: Export the .pkg
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$GITHUB_WORKSPACE/build/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.beatrackfaminc.flightjournal</key>
              <string>${MAC_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/FlightJournal-macOS.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/pkg" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

      - name: Upload the .pkg as a run artifact
        uses: actions/upload-artifact@v6
        with:
          name: FlightJournal-macOS-${{ env.APP_VERSION }}-${{ env.APP_BUILD }}-pkg
          path: build/pkg/*.pkg
          if-no-files-found: error
          retention-days: 30

      - name: Upload the build to App Store Connect (TestFlight / Mac App Store)
        if: inputs.upload_to_testflight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          PKG="$(ls "$GITHUB_WORKSPACE"/build/pkg/*.pkg | head -1)"
          echo "Uploading $PKG to App Store Connect..."
          # altool looks for AuthKey_<id>.p8 in ~/.appstoreconnect/private_keys
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/"
          ok=""
          for attempt in 1 2 3; do
            echo "Upload attempt $attempt of 3..."
            if xcrun altool --upload-app --type macos --file "$PKG" \
                 --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"; then
              ok=1; break
            fi
            sleep 20
          done
          if [ -z "$ok" ]; then
            echo "::error::Upload failed after 3 attempts. The .pkg is still saved as a run artifact above — upload that file in Transporter instead."
            exit 1
          fi
          echo "Uploaded. Apple processes the build (usually ~5-30 min), then it appears under the app's macOS platform in App Store Connect / TestFlight."

      - name: Remove the API key
        if: always()
        run: rm -rf "$HOME/private_keys"
